services:
  # XgirlfriendGPT Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: xgirlfriendgpt-app
    network_mode: "host"
    environment:
      - ENV=production
      - LLM_PROVIDER=ollama
      - LLM_BASE_URL=http://127.0.0.1:11434/v1
      - DEFAULT_MODEL=${DEFAULT_MODEL:-R4C3R/qwen3-8b-heretic:q8_0}
      - QDRANT_HOST=localhost
      - QDRANT_COLLECTION=companion_memories
      - FASTEMBED_CACHE_PATH=/tmp/fastembed_cache
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./app/static:/app/app/static
      - /home/jason/models:/home/jason/models:ro
      - /home/jason/AI-ImageGen:/home/jason/AI-ImageGen:ro
    depends_on:
#      - ollama
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Ollama LLM Server
#  ollama:
#    image: ollama/ollama:latest
#    container_name: xgirlfriendgpt-ollama
#   ports:
#      - "11434:11434"
#    volumes:
#      - ollama_data:/root/.ollama
#    environment:
#      - OLLAMA_HOST=0.0.0.0
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]
#    restart: unless-stopped
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 30s

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: xgirlfriendgpt-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ComfyUI Image Generation (Optional - requires GPU)
  # Uncomment and configure for image generation
  # comfyui:
  #   image: comfyui/comfyui:latest
  #   container_name: xgirlfriendgpt-comfyui
  #   ports:
  #     - "8188:8188"
  #   volumes:
